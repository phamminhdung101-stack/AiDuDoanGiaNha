{% extends "base.html" %}
{% block title %}Đăng nhập — HouseAI{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__header">
      <div style="font-size:32px;color:var(--accent);margin-bottom:16px"><i class="ph-fill ph-hexagon"></i></div>
      <h1>Đăng nhập</h1>
      <p>Chào mừng bạn trở lại với HouseAI</p>
    </div>

    <form class="auth-form" method="POST" action="/login">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrap" style="position:relative">
          <i class="ph ph-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3)"></i>
          <input type="text" style="padding-left:40px" id="username" name="username" placeholder="Nhập tên đăng nhập" required autocomplete="username"/>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap" style="position:relative">
          <i class="ph ph-lock-key" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3)"></i>
          <input type="password" style="padding-left:40px" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
          <button type="button" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3)" onclick="togglePw(this)"><i class="ph ph-eye"></i></button>
        </div>
      </div>

      <div class="form-group form-group--row" style="margin-top:8px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;color:var(--text-2);font-size:14px">
          <input type="checkbox" name="is_admin" style="width:auto;box-shadow:none"/>
          Đăng nhập với tư cách Quản trị viên
        </label>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg" style="margin-top:8px">Đăng nhập</button>
    </form>

    <div class="auth-card__footer">
      Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePw(btn) {
  const inp = btn.previousElementSibling;
  const icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.classList.replace('ph-eye', 'ph-eye-slash');
  } else {
    inp.type = 'password';
    icon.classList.replace('ph-eye-slash', 'ph-eye');
  }
}
</script>
{% endblock %}
